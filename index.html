<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asta Fantacalcio</title><style>:root{--line:#51489d;--p:#ffb653;--d:#66e85c;--c:#24b3ed;--a:#fc6978}*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Arial,sans-serif;background:#08052b}.topbar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#08052b;border-bottom:1px solid #3e367d;position:sticky;top:0;z-index:2}h1{font-size:16px;margin:0}.actions{display:flex;gap:5px}button{color:#fff;background:#292161;border:1px solid #5c52ae;border-radius:5px;padding:5px 7px;font-weight:bold}#status{margin-left:auto;color:#c1bde4;font-size:12px}.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;padding:6px;width:100%}.team{min-width:0;padding:3px;border:1px solid #39327d;border-radius:7px;background:#130d3f}.team-head{padding:5px;border:1px solid #5b50b5;border-radius:5px;background:#251b66}.team-name{width:100%;color:#fff;background:transparent;border:0;border-bottom:1px solid #aaa;font-weight:bold;font-size:12px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:4px}.metric{padding:3px;background:#0b082f;border-radius:3px}.metric small{display:block;font-size:7px;color:#cdc8f1}.metric strong{font-size:12px}.ok{color:#78f373}.bad{color:#ff7180}.roster{text-align:center;font-size:8px;margin-top:4px}.role{margin-top:5px}.role-title{display:flex;justify-content:space-between;padding:3px 5px;color:#11102c;font-size:9px;font-weight:bold;border-radius:4px}.p .role-title{background:var(--p)}.d .role-title{background:var(--d)}.c .role-title{background:var(--c)}.a .role-title{background:var(--a)}.player-row{display:grid;grid-template-columns:minmax(0,1fr) 32px;gap:2px;margin-top:2px}.player-row input{min-width:0;height:20px;color:#fff;background:#171247;border:1px solid var(--line);border-radius:3px;font-size:8px;padding:2px}.cost{text-align:center;font-weight:bold}@media(max-width:1000px){.board{min-width:1000px}}</style></head><body><header class="topbar"><h1>⚽ Asta Fantacalcio — 10 Squadre</h1><div class="actions"><button id="save">Salva</button><button id="export">Esporta</button><button id="import">Importa</button><button id="reset">Azzera</button></div><span id="status">Pronto</span><input id="file" type="file" accept="application/json" hidden></header><main id="board" class="board"></main><script>const C=500,K='asta10v2',R=[['p','P · Portieri',3],['d','D · Difensori',8],['c','C · Centrocampisti',8],['a','A · Attaccanti',6]];const team=i=>({nome:'Squadra '+(i+1),g:Object.fromEntries(R.map(x=>[x[0],Array.from({length:x[2]},()=>({n:'',p:''}))]))});const base=()=>({s:Array.from({length:10},(_,i)=>team(i))});function normal(v){let b=base();if(!v||!Array.isArray(v.s))return b;v.s.slice(0,10).forEach((t,i)=>{b.s[i].nome=typeof t.nome==='string'?t.nome:b.s[i].nome;R.forEach(r=>{if(t.g&&Array.isArray(t.g[r[0]]))t.g[r[0]].slice(0,r[2]).forEach((x,j)=>b.s[i].g[r[0]][j]={n:String(x.n||''),p:String(x.p||'')})})});return b}let s;try{s=normal(JSON.parse(localStorage.getItem(K)))||base()}catch{s=base()}function num(x){x=parseFloat(String(x).replace(',','.'));return isFinite(x)&&x>0?x:0}function esc(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function sum(t){let sp=0,n=0;R.forEach(r=>t.g[r[0]].forEach(x=>{sp+=num(x.p);if(x.n.trim())n++}));return[sp,C-sp,n]}function show(i){let q=sum(s.s[i]),d=document.querySelector('[data-head="'+i+'"]').parentElement;d.querySelector('.sp').textContent=q[0];let z=d.querySelector('.rm');z.textContent=q[1];z.className='rm '+(q[1]<0?'bad':'ok');d.querySelector('.rs').textContent=q[2]+'/25'}function render(){let b=document.querySelector('#board');b.innerHTML='';s.s.forEach((t,i)=>{let q=sum(t),d=document.createElement('section');d.className='team';d.innerHTML='<div class="team-head" data-head="'+i+'"><input class="team-name" data-name="'+i+'" value="'+esc(t.nome)+'"><div class="metrics"><div class="metric"><small>CREDITI</small><strong>500</strong></div><div class="metric"><small>SPESI</small><strong class="sp">'+q[0]+'</strong></div><div class="metric"><small>RIMASTI</small><strong class="rm '+(q[1]<0?'bad':'ok')+'">'+q[1]+'</strong></div><div class="metric"><small>ROSA</small><strong class="rs">'+q[2]+'/25</strong></div></div></div>';R.forEach(r=>{let z=document.createElement('div');z.className='role '+r[0];z.innerHTML='<div class="role-title"><span>'+r[1]+'</span><span>'+r[2]+'</span></div>';t.g[r[0]].forEach((x,j)=>{let v=document.createElement('div');v.className='player-row';v.innerHTML='<input placeholder="Giocatore" data-x="n" data-t="'+i+'" data-r="'+r[0]+'" data-j="'+j+'" value="'+esc(x.n)+'"><input class="cost" placeholder="€" inputmode="decimal" data-x="p" data-t="'+i+'" data-r="'+r[0]+'" data-j="'+j+'" value="'+esc(x.p)+'">';z.append(v)});d.append(z)});b.append(d)})}document.addEventListener('input',e=>{let x=e.target;if(x.dataset.name!==undefined){s.s[+x.dataset.name].nome=x.value;return}if(!x.dataset.x)return;let i=+x.dataset.t;s.s[i].g[x.dataset.r][+x.dataset.j][x.dataset.x]=x.value;show(i)});function msg(v){let x=document.querySelector('#status');x.textContent=v;setTimeout(()=>x.textContent='Pronto',1800)}document.querySelector('#save').onclick=()=>{localStorage.setItem(K,JSON.stringify(s));msg('✓ Salvato')};document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='backup-asta.json';a.click();URL.revokeObjectURL(a.href);msg('✓ Esportato')};document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=e=>{let r=new FileReader();r.onload=()=>{try{s=normal(JSON.parse(r.result));render();msg('✓ Importato')}catch{alert('Backup non valido')}};r.readAsText(e.target.files[0])};document.querySelector('#reset').onclick=()=>{if(confirm('Azzerare tutto?')){s=base();render();msg('Griglia azzerata')}};render();</script></body></html>
